<!DOCTYPE html>
<html>

<head>

    <title>VedAura AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<link rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='favicon2.png') }}">
    <title>VedAura AI</title>

    <link rel="stylesheet"
            href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet"
            href="{{ url_for('static', filename='mobile.css') }}">
</head>

<body>
let currentConversation = 0;

<div class="app">

    <!-- Vertical Line -->
    <div class="left-line"></div>
    <!-- Sidebar -->

   <div id="sidebar" class="sidebar">
        <button id="newChatBtn" class="new-chat-btn">
            ＋ New Chat
        </button>

        <div id="chatHistory" class="chat-history">
        </div>
        
    </div>

    <div id="overlay" class="overlay"></div>

    <!-- Header -->
    <header class="header">

        <div class="logo-box">
            <img id="logo"
                src="{{ url_for('static', filename='logo.png') }}"
                class="logo"
                alt="VedAura Logo">
        </div>
        

        <div class="content-side">

            <div class="title-box">
                <h1>VedAura AI</h1>
                <p>Your Personal AI Assistant</p>
            </div>

        </div>

        <div class="theme-toggle">
            <button id="themeBtn" title="Switch to Dark Mode">
                🌙
            </button>
        </div>


    </header>

    <button id="menuBtn" class="menu-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M4 6H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>

    <div id="splash-screen">
        <img src="{{ url_for('static', filename='splash.png') }}" alt="Splash">
    </div>

    <!-- Main Chat Area -->
    <main id="chatbox" class="chatbox">

        <div class="welcome-message" id="welcomeContainer">

            <h2>Where should we begin?</h2>

            <p>Hello! 👋 How can I help you today?</p>

            <div class="quick-actions">

                <div class="action-card">
                    💻 Help me write code
                </div>

                <div class="action-card">
                    📄 Summarize a PDF
                </div>

                <div class="action-card">
                    🌐 Search the Web
                </div>

                <div class="action-card">
                    🧠 Explain difficult topics
            </div>

        </div>

    </main>

    <!-- Footer -->
    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Ask VedAura anything...">

        <button id="sendBtn">
            <span class="send-icon">➤</span>
        </button>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<div id="renameModal" class="rename-modal">

    <div class="rename-box">

        <h3>Rename Conversation</h3>

        <input
            type="text"
            id="renameInput"
            placeholder="Conversation name">

        <div class="rename-buttons">

            <button id="cancelRename">Cancel</button>

            <button id="saveRename">Save</button>

        </div>

    </div>

</div>

<div id="deleteModal" class="rename-modal">

    <div class="rename-box">

        <h3>Delete Conversation?</h3>

        <p>This action cannot be undone.</p>

        <div class="rename-buttons">

            <button id="cancelDelete">Cancel</button>

            <button id="confirmDelete" class="delete-confirm">
                Delete
            </button>

        </div>

    </div>

</div>

<script>

const chat = document.getElementById("chatbox");
const input = document.getElementById("message");
const button = document.getElementById("sendBtn");

button.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(e){
    if(e.key==="Enter"){
        sendMessage();
    }
});
const historyContainer = document.getElementById("chatHistory");



let conversations = JSON.parse(localStorage.getItem("conversations")) || [];


const renameModal = document.getElementById("renameModal");
const renameInput = document.getElementById("renameInput");
const saveRename = document.getElementById("saveRename");
const cancelRename = document.getElementById("cancelRename");

let renameIndex = -1;

const deleteModal = document.getElementById("deleteModal");
const confirmDelete = document.getElementById("confirmDelete");
const cancelDelete = document.getElementById("cancelDelete");

let deleteIndex = -1;

function addHistory(title, index){

    const item = document.createElement("div");
    item.className = "history-item";

    item.innerHTML = `
        <span class="history-title">${title}</span>

        <div class="history-actions">
            <button class="rename-btn">✏️</button>
            <button class="delete-btn">🗑️</button>
        </div>
    `;
    const renameBtn = item.querySelector(".rename-btn");

    renameBtn.onclick = () => {

        renameModal.classList.add("show");

        renameInput.value = title;

        renameIndex = Array.from(historyContainer.children).indexOf(item);

    };
    historyContainer.prepend(item);

}
function renderHistory(){

    historyContainer.innerHTML = "";

    conversations.forEach((conversation, index)=>{

        const item = document.createElement("div");

        item.className = "history-item";

        item.innerHTML = `
            <span class="history-title">${conversation.title}</span>

            <div class="history-actions">
                <button class="rename-btn">✏️</button>
                <button class="delete-btn">🗑️</button>
            </div>
        `;
        const renameBtn = item.querySelector(".rename-btn");
        const deleteBtn = item.querySelector(".delete-btn");
        renameBtn.onclick = (e) => {

        e.stopPropagation();

        renameModal.classList.add("show");

        renameInput.value = conversation.title;

        renameIndex = index;

        };
        deleteBtn.onclick = (e) => {

            e.stopPropagation();

            deleteIndex = index;

            deleteModal.classList.add("show");

        renderHistory();

        };

        item.onclick = () => openConversation(index);

        historyContainer.appendChild(item);

    });

}
renderHistory();

function openConversation(index){
    currentConversation = index;
    const conversation = conversations[index];

    chat.innerHTML = "";

    conversation.messages.forEach(msg => {

        if(msg.role === "user"){

            chat.innerHTML += `
            <div class="user-message">
                <b>You:</b> ${msg.text}
            </div>
            `;

        }else{

            chat.innerHTML += `
            <div class="bot-message">
                <b>VedAura:</b><br>
                ${marked.parse(msg.text)}
            </div>
            `;

        }

    });

    sidebar.classList.remove("open");
    overlay.classList.remove("show");

}

function newChat(){

    chat.innerHTML = "";
    input.value = "";

    conversations.unshift({
        title: "New Chat",
        messages: []
    });

    currentConversation = 0;

    localStorage.setItem(
        "conversations",
        JSON.stringify(conversations)
    );

    renderHistory();

    input.focus();
}

async function sendMessage(){

    if(button.disabled) return;

    let message = input.value.trim();

    if(message==="") return;

    // Disable input while AI is thinking
    input.disabled = true;
    button.disabled = true;
    button.innerHTML = `
    <span class="send-icon">⌛</span>
    `;

    const app = document.querySelector(".app");
    app.classList.add("chat-started");

    const welcome = document.getElementById("welcomeContainer");
    if(welcome){
        welcome.remove();
    }

    // Show user message
    chat.innerHTML += `
    <div class="user-message">
        <b>You:</b> ${message}
    </div>
    `;


    conversations[currentConversation].messages.push({
    role: "user",
    text: message
    });

    localStorage.setItem(
        "conversations",
        JSON.stringify(conversations)
    );


    input.value = "";

    chat.innerHTML += `
    <div id="loadingMessage" class="bot-message">

        <b>VedAura:</b>

        <div class="thinking-animation">

            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>
    `;
    chat.scrollTop = chat.scrollHeight;


    chat.scrollTop = chat.scrollHeight;


    // Send request to Flask
    const response = await fetch("/chat",{

        method:"POST",

        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },

        body:"message="+encodeURIComponent(message)

    });

    const reply = await response.text();
  
    chat.scrollTop = chat.scrollHeight;
    // Remove loading message
    const loading = document.getElementById("loadingMessage");
    if(loading){
        loading.remove();
    }

    // Create empty AI message
    const typingId = "typing-" + Date.now();

    chat.innerHTML += `
    <div class="bot-message">
        <b>VedAura:</b><br>
        <span id="${typingId}"></span>
    </div>
    `;
    const typing = document.getElementById(typingId);

    const formattedReply = marked.parse(reply);

    let i = 0;

    const interval = setInterval(() => {

        typing.textContent = reply.substring(0, i);
        chat.scrollTop = chat.scrollHeight;
        i++;

        if(i > reply.length){

            clearInterval(interval);
            typing.innerHTML = marked.parse(reply);
            if(
                conversations[currentConversation].messages.length === 0
            ){
                conversations[currentConversation].title = message;
                renderHistory();
            }
            conversations[currentConversation].messages.push({
                role: "assistant",
                text: reply
            });

            localStorage.setItem(
                "conversations",
                JSON.stringify(conversations)
            );
           typing.querySelectorAll("pre code").forEach((block) => {
                hljs.highlightElement(block);
            });
            input.disabled = false;
            button.disabled = false;

            button.innerHTML = `
                <span class="send-icon">➤</span>
            `;

            input.focus();
        }

    }, 12);

    chat.scrollTop = chat.scrollHeight;

    // Remove these lines from below because they're now inside the animation
    // input.disabled = false;
    // button.disabled = false;
    // button.innerText = "Send";
    // input.focus();

    chat.scrollTop = chat.scrollHeight;

    // Re-enable input

}
const themeBtn = document.getElementById("themeBtn");
const newChatBtn = document.getElementById("newChatBtn");
newChatBtn.onclick = newChat;


const logo = document.getElementById("logo");

console.log(themeBtn);

themeBtn.onclick = function () {

    document.body.classList.toggle("dark-mode");

    if(document.body.classList.contains("dark-mode")){

        themeBtn.innerHTML = "☀️";
        themeBtn.title = "Switch to Light Mode";

        // Change logo
        logo.src = "{{ url_for('static', filename='logo-dark.png') }}";

    }else{

        themeBtn.innerHTML = "🌙";
        themeBtn.title = "Switch to Dark Mode";

        // Change logo back
        logo.src = "{{ url_for('static', filename='logo.png') }}";
    }

};

document.addEventListener("DOMContentLoaded", () => {

    const splash = document.getElementById("splash-screen");

    setTimeout(() => {

        splash.style.opacity = "0";

        setTimeout(() => {
            splash.remove();
        }, 1000);

    }, 3000);   // <-- stay for 6 seconds
});
const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

menuBtn.onclick = () =>{

    sidebar.classList.add("open");

    overlay.classList.add("show");

};

overlay.onclick = () =>{

    sidebar.classList.remove("open");

    overlay.classList.remove("show");

};
saveRename.onclick = () => {

    const newName = renameInput.value.trim();

    if(newName === "") return;

    conversations[renameIndex].title = newName;

    localStorage.setItem(
        "conversations",
        JSON.stringify(conversations)
    );

    renameModal.classList.remove("show");

    renderHistory();

};

cancelRename.onclick = () => {

    renameModal.classList.remove("show");

};
cancelDelete.onclick = () => {

    deleteModal.classList.remove("show");

};
confirmDelete.onclick = () => {

    conversations.splice(deleteIndex, 1);

    localStorage.setItem(
        "conversations",
        JSON.stringify(conversations)
    );

    deleteModal.classList.remove("show");

    renderHistory();

};


</script>

</body>

</html>
