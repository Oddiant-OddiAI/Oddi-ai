<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VedAura Login</title>
    <link rel="stylesheet" href="/static/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <img src="/static/logo.png" class="auth-logo">

            <h1>VedAura AI</h1>

            <h2>Welcome Back 👋</h2>

            <form action="/login" method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                >

                <div class="password-box">

                    <input
                        type="password"
                        id="passwordInput"
                        name="password"
                        placeholder="Password"
                        required
                    >

                    <span id="togglePassword" class="eye-btn">👁</span>
                <br>
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <a href="/signup">
                Create an Account
            </a>

        </div>

    </div>
<script>
const passwordInput = document.getElementById("passwordInput");
const eyeBtn = document.getElementById("togglePassword");

eyeBtn.onclick = () => {
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeBtn.textContent = "🙈";
    } else {
        passwordInput.type = "password";
        eyeBtn.textContent = "👁";
    }
};
</script>
</body>
</html>
